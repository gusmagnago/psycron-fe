# .github/workflows/dev-changelog.yml
# ─────────────────────────────────────────────────────────────
# Psycron — Dev Branch Changelog Generator
# ─────────────────────────────────────────────────────────────
# Runs on every push to `dev`. Generates a diff summary showing
# all commits and file changes between `main` and `dev`.
# Posts the summary as a PR comment (if a dev→main PR exists)
# and updates a pinned GitHub Issue for visibility.
#
# Setup: No secrets needed beyond default GITHUB_TOKEN.
# ─────────────────────────────────────────────────────────────

name: "📋 Dev Changelog"

on:
  push:
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy dev → Vercel preview
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEV_DEPLOY_HOOK }}" | jq .

  changelog:
    name: Generate dev↔main diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure main ref is available
        run: git fetch origin main:refs/remotes/origin/main

      - name: Generate changelog
        id: diff
        run: |
          echo "## 🔀 Dev vs Main — $(date -u '+%Y-%m-%d %H:%M UTC')" > changelog.md
          echo "" >> changelog.md

          # Count commits ahead
          AHEAD=$(git rev-list --count origin/main..dev 2>/dev/null || echo "0")
          BEHIND=$(git rev-list --count dev..origin/main 2>/dev/null || echo "0")
          echo "**Branch status:** \`dev\` is **${AHEAD} commits ahead**, ${BEHIND} commits behind \`main\`" >> changelog.md
          echo "" >> changelog.md

          # List commits (grouped by conventional commit type)
          echo "### Commits since last release" >> changelog.md
          echo "" >> changelog.md
          echo "| Hash | Author | Message | Date |" >> changelog.md
          echo "|------|--------|---------|------|" >> changelog.md
          git log origin/main..dev --pretty=format="| \`%.7h\` | %an | %s | %ad |" --date=short >> changelog.md
          echo "" >> changelog.md
          echo "" >> changelog.md

          # Categorize by conventional commits
          echo "### Changes by category" >> changelog.md
          echo "" >> changelog.md

          FEATS=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^feat" || true)
          FIXES=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^fix" || true)
          SECS=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^sec" || true)
          REFACTORS=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^refactor" || true)
          DOCS=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^docs" || true)
          CHORES=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^chore" || true)

          echo "| Category | Count |" >> changelog.md
          echo "|----------|-------|" >> changelog.md
          echo "| ✨ Features (\`feat\`) | ${FEATS} |" >> changelog.md
          echo "| 🐛 Fixes (\`fix\`) | ${FIXES} |" >> changelog.md
          echo "| 🔒 Security (\`sec\`) | ${SECS} |" >> changelog.md
          echo "| ♻️ Refactors (\`refactor\`) | ${REFACTORS} |" >> changelog.md
          echo "| 📝 Docs (\`docs\`) | ${DOCS} |" >> changelog.md
          echo "| 🔧 Chores (\`chore\`) | ${CHORES} |" >> changelog.md
          echo "" >> changelog.md

          # File change summary
          echo "### Files changed" >> changelog.md
          echo "" >> changelog.md
          echo "\`\`\`" >> changelog.md
          git diff --stat origin/main..dev >> changelog.md
          echo "\`\`\`" >> changelog.md
          echo "" >> changelog.md

          # Key directories impacted
          echo "### Key areas impacted" >> changelog.md
          echo "" >> changelog.md
          git diff --name-only origin/main..dev | sed 's|/[^/]*$||' | sort -u | head -20 | while read dir; do
            COUNT=$(git diff --name-only origin/main..dev | grep "^${dir}/" | wc -l)
            echo "- \`${dir}/\` — ${COUNT} files" >> changelog.md
          done
          echo "" >> changelog.md

          # Store for next step
          echo "ahead=${AHEAD}" >> $GITHUB_OUTPUT

      - name: Find or create tracking issue
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '📋 Dev Branch Changelog (Auto-Updated)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'changelog',
              per_page: 1
            });

            let issueNumber;
            if (issues.length > 0) {
              issueNumber = issues[0].number;
            } else {
              // Create the tracking issue
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                labels: ['changelog'],
                body: 'This issue is auto-updated by the Dev Changelog workflow.'
              });
              issueNumber = newIssue.number;
              // Pin it
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'open'
              });
            }
            core.setOutput('number', issueNumber);

      - name: Update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.md', 'utf8');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.issue.outputs.number }},
              body: changelog
            });

      - name: Comment on open dev→main PR (if exists)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.md', 'utf8');

            // Find open PRs from dev to main
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:dev`,
              base: 'main'
            });

            for (const pr of prs) {
              // Delete previous bot comment if exists
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100
              });
              const botComment = comments.find(c =>
                c.user.type === 'Bot' && c.body.includes('Dev vs Main')
              );
              if (botComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id
                });
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: changelog
              });
            }

      - name: Update Confluence "What's in Dev" + Open Tickets from Jira
        if: env.CONFLUENCE_AUTH != ''
        env:
          CONFLUENCE_AUTH: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_CLOUD_ID: "7fc7f600-112d-4a1d-b837-02dc51ca2682"
          CONFLUENCE_PAGE_ID: "132120577"
          JIRA_PROJECT_KEY: "PR"
        run: |
          REPO="${{ github.event.repository.name }}"
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          AHEAD=$(git rev-list --count origin/main..dev 2>/dev/null || echo "0")

          # Recent commits (last 15)
          RECENT=$(git log origin/main..dev --pretty=format:"%h|%an|%s|%ad" --date=short | head -15)

          # Category counts
          FEATS=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^feat" || true)
          FIXES=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^fix" || true)
          SECS=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^sec" || true)
          REFACTORS=$(git log origin/main..dev --pretty=format:"%s" | grep -c "^refactor" || true)

          # Get current Confluence page
          PAGE_DATA=$(curl -s \
            "https://api.atlassian.com/ex/confluence/${CONFLUENCE_CLOUD_ID}/wiki/api/v2/pages/${CONFLUENCE_PAGE_ID}?body-format=storage" \
            -H "Authorization: Basic ${CONFLUENCE_AUTH}" \
            -H "Accept: application/json")

          # Query Jira for open non-Epic tickets in project
          JQL="project = ${JIRA_PROJECT_KEY} AND issuetype != Epic AND statusCategory != Done ORDER BY priority ASC, key ASC"
          ENCODED_JQL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${JQL}'))")
          JIRA_DATA=$(curl -s \
            "https://api.atlassian.com/ex/jira/${CONFLUENCE_CLOUD_ID}/rest/api/3/search?jql=${ENCODED_JQL}&fields=summary,status,priority,assignee,parent&maxResults=50" \
            -H "Authorization: Basic ${CONFLUENCE_AUTH}" \
            -H "Accept: application/json")

          export PAGE_JSON="$PAGE_DATA"
          export JIRA_JSON="$JIRA_DATA"
          export DEV_REPO="$REPO"
          export DEV_DATE="$DATE"
          export DEV_AHEAD="$AHEAD"
          export DEV_RECENT="$RECENT"
          export DEV_FEATS="$FEATS"
          export DEV_FIXES="$FIXES"
          export DEV_SECS="$SECS"
          export DEV_REFACTORS="$REFACTORS"
          export DEV_REQUIREMENTS="$(cat .github/release-requirements.json)"

          PAYLOAD=$(node -e "
            const page = JSON.parse(process.env.PAGE_JSON);
            const jiraResult = JSON.parse(process.env.JIRA_JSON);
            const repo = process.env.DEV_REPO;
            const date = process.env.DEV_DATE;
            const ahead = process.env.DEV_AHEAD;
            const recent = process.env.DEV_RECENT;
            const feats = process.env.DEV_FEATS;
            const fixes = process.env.DEV_FIXES;
            const secs = process.env.DEV_SECS;
            const refactors = process.env.DEV_REFACTORS;
            const config = JSON.parse(process.env.DEV_REQUIREMENTS);

            const esc = s => s.replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));

            // --- Requirements progress ---
            const reqs = config.requirements;
            const blockers = config.blockers || [];
            const doneCount = reqs.filter(r => r.status === 'done').length;
            const totalCount = reqs.length;
            const pct = Math.round((doneCount / totalCount) * 100);
            const blockersResolved = blockers.filter(b => b.status === 'done').length;

            const barColor = pct >= 90 ? '#4caf50' : pct >= 60 ? '#ff9800' : '#2196f3';

            const progressBar = [
              '<h3>v' + config.version + ' Release Progress</h3>',
              '<div style=\"background:#e0e0e0;border-radius:8px;overflow:hidden;height:28px;margin:8px 0 16px 0;\">',
              '<div style=\"background:' + barColor + ';height:100%;width:' + pct + '%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:14px;border-radius:8px;transition:width 0.3s;\">',
              pct + '%',
              '</div></div>',
              '<p><strong>' + doneCount + '</strong> of <strong>' + totalCount + '</strong> requirements done &mdash; <strong>' + blockersResolved + '</strong> of <strong>' + blockers.length + '</strong> blockers resolved</p>',
            ].join('');

            // Requirements table
            const statusIcon = s => s === 'done' ? '&#9989;' : s === 'in-progress' ? '&#9888;&#65039;' : '&#128308;';
            const reqRows = reqs.map(r => {
              const tickets = (r.tickets || []).map(t =>
                '<a href=\"' + t.url + '\">' + esc(t.key) + '</a>: ' + esc(t.summary)
              ).join('<br/>');
              const note = r.note ? '<em>' + esc(r.note) + '</em>' : '';
              const details = [tickets, note].filter(Boolean).join('<br/>');
              return '<tr><td>' + statusIcon(r.status) + '</td><td>' + esc(r.name) + '</td><td>' + r.status + '</td><td>' + details + '</td></tr>';
            }).join('');

            const reqTable = [
              '<h3>Requirements</h3>',
              '<table><tbody>',
              '<tr><th></th><th>Feature</th><th>Status</th><th>Details</th></tr>',
              reqRows,
              '</tbody></table>',
            ].join('');

            // Blockers table
            const blockerRows = blockers.map(b => {
              return '<tr><td>' + statusIcon(b.status) + '</td><td><a href=\"' + b.url + '\">' + esc(b.ticket) + '</a></td><td>' + esc(b.name) + '</td><td>' + b.status + '</td></tr>';
            }).join('');

            const blockerTable = blockers.length > 0 ? [
              '<h3>Blockers</h3>',
              '<table><tbody>',
              '<tr><th></th><th>Ticket</th><th>Description</th><th>Status</th></tr>',
              blockerRows,
              '</tbody></table>',
            ].join('') : '';

            // --- Open Tickets table from live Jira data ---
            const jiraIssues = (jiraResult.issues || []);
            const ticketRows = jiraIssues.map(issue => {
              const f = issue.fields;
              const key = issue.key;
              const url = 'https://psycron.atlassian.net/browse/' + key;
              const summary = esc(f.summary || '');
              const status = esc((f.status || {}).name || 'Unknown');
              const priority = esc((f.priority || {}).name || '-');
              const assignee = esc((f.assignee || {}).displayName || 'Unassigned');
              const parentKey = (f.parent || {}).key || '';
              const parentSummary = ((f.parent || {}).fields || {}).summary || '';
              const epicCol = parentKey
                ? '<a href=\"https://psycron.atlassian.net/browse/' + parentKey + '\">' + esc(parentKey) + '</a>: ' + esc(parentSummary)
                : '&mdash;';
              return '<tr><td><a href=\"' + url + '\">' + key + '</a></td><td>' + summary + '</td><td>' + status + '</td><td>' + priority + '</td><td>' + assignee + '</td><td>' + epicCol + '</td></tr>';
            }).join('');

            const openTicketsSection = [
              '<p><em>Auto-synced from Jira on ' + esc(date) + '. Excludes Done tickets and Epics.</em></p>',
              '<table><tbody>',
              '<tr><th>Ticket</th><th>Summary</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Epic</th></tr>',
              ticketRows,
              '</tbody></table>',
            ].join('');

            // Build commit table rows
            const rows = recent.split('\n').filter(Boolean).map(line => {
              const [hash, author, msg, d] = line.split('|');
              return '<tr><td><code>' + esc(hash) + '</code></td><td>' + esc(author) + '</td><td>' + esc(msg) + '</td><td>' + esc(d) + '</td></tr>';
            }).join('');

            const section = [
              '<p><em>Auto-updated by GitHub Actions on ' + esc(date) + ' from <strong>' + esc(repo) + '</strong></em></p>',
              // Progress bar intentionally NOT rendered here: it is inserted once in the
              // 'Current Status' section below (which de-dupes prior bars). Rendering it in
              // both sections produced duplicate/conflicting progress bars on the page.
              reqTable,
              blockerTable,
              '<h3>Dev branch status</h3>',
              '<p><strong>' + esc(repo) + '</strong> &mdash; <strong>' + ahead + ' commits</strong> ahead of main</p>',
              '<h3>Category breakdown</h3>',
              '<table><tbody>',
              '<tr><th>Category</th><th>Count</th></tr>',
              '<tr><td>Features (feat)</td><td>' + feats + '</td></tr>',
              '<tr><td>Fixes (fix)</td><td>' + fixes + '</td></tr>',
              '<tr><td>Security (sec)</td><td>' + secs + '</td></tr>',
              '<tr><td>Refactors (refactor)</td><td>' + refactors + '</td></tr>',
              '</tbody></table>',
              '<h3>Recent commits</h3>',
              '<table><tbody>',
              '<tr><th>Hash</th><th>Author</th><th>Message</th><th>Date</th></tr>',
              rows,
              '</tbody></table>',
            ].join('');

            let body = page.body.storage.value;

            // Replace 'What's in Dev Right Now' section
            const marker = 'in Dev Right Now';
            const idx = body.indexOf(marker);
            if (idx !== -1) {
              const afterHeading = body.indexOf('>', idx) + 1;
              const nextH2 = body.indexOf('<h2', afterHeading);
              const nextHr = body.indexOf('<hr', afterHeading);
              let endIdx = body.length;
              if (nextH2 !== -1) endIdx = Math.min(endIdx, nextH2);
              if (nextHr !== -1 && nextHr < endIdx) endIdx = nextHr;
              body = body.slice(0, afterHeading) + section + body.slice(endIdx);
            }

            // Replace 'Open Tickets' section with live Jira data
            const ticketMarker = 'Open Tickets';
            const ticketIdx = body.indexOf(ticketMarker);
            if (ticketIdx !== -1) {
              const afterTicketHeading = body.indexOf('>', ticketIdx) + 1;
              const nextTicketH2 = body.indexOf('<h2', afterTicketHeading);
              const nextTicketHr = body.indexOf('<hr', afterTicketHeading);
              let ticketEnd = body.length;
              if (nextTicketH2 !== -1) ticketEnd = Math.min(ticketEnd, nextTicketH2);
              if (nextTicketHr !== -1 && nextTicketHr < ticketEnd) ticketEnd = nextTicketHr;
              body = body.slice(0, afterTicketHeading) + openTicketsSection + body.slice(ticketEnd);
            }

            // Also update the Current Status section with the progress bar
            const statusMarker = 'Current Status';
            const statusIdx = body.indexOf(statusMarker);
            if (statusIdx !== -1) {
              const afterStatusHeading = body.indexOf('>', statusIdx) + 1;
              const nextSection = body.indexOf('<h2', afterStatusHeading);
              const nextStatusHr = body.indexOf('<hr', afterStatusHeading);
              let statusEnd = body.length;
              if (nextSection !== -1) statusEnd = Math.min(statusEnd, nextSection);
              if (nextStatusHr !== -1 && nextStatusHr < statusEnd) statusEnd = nextStatusHr;

              const existingContent = body.slice(afterStatusHeading, statusEnd);
              const cleaned = existingContent.replace(/<h3>v[\d.]+\sRelease Progress<\/h3>[\s\S]*?resolved<\/p>/g, '');
              body = body.slice(0, afterStatusHeading) + progressBar + cleaned + body.slice(statusEnd);
            }

            const payload = {
              id: process.env.CONFLUENCE_PAGE_ID,
              status: 'current',
              title: page.title,
              body: { representation: 'storage', value: body },
              version: {
                number: page.version.number + 1,
                message: 'Auto-update: ' + repo + ' dev changelog (' + date + ')'
              }
            };

            process.stdout.write(JSON.stringify(payload));
          ")

          HTTP_STATUS=$(curl -s -o /tmp/confluence_response.json -w "%{http_code}" \
            -X PUT \
            "https://api.atlassian.com/ex/confluence/${CONFLUENCE_CLOUD_ID}/wiki/api/v2/pages/${CONFLUENCE_PAGE_ID}" \
            -H "Authorization: Basic ${CONFLUENCE_AUTH}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Confluence updated: What's in Dev + Open Tickets (HTTP ${HTTP_STATUS})"
          else
            echo "⚠️ Confluence update failed (HTTP ${HTTP_STATUS}) — changelog was still generated"
            cat /tmp/confluence_response.json
          fi
